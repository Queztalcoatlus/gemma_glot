steps:
  - name: gcr.io/cloud-builders/docker
    id: build-vllm
    entrypoint: bash
    env:
      - DOCKER_BUILDKIT=1
    secretEnv:
      - HF_TOKEN
    args:
      - -ceu
      - |
        docker build \
          --tag="${_IMAGE}" \
          --build-arg MODEL_NAME="${_MODEL_NAME}" \
          --build-arg VLLM_IMAGE="${_VLLM_IMAGE}" \
          --secret id=HF_TOKEN,env=HF_TOKEN \
          .

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/HF_TOKEN/versions/latest
      env: HF_TOKEN

images:
  - ${_IMAGE}

substitutions:
  _LOCATION: us-central1
  _REPO_NAME: gemmaglot-vllm
  _SERVICE_NAME: gemmaglot-vllm
  _MODEL_NAME: google/gemma-4-E4B-it
  _VLLM_IMAGE: vllm/vllm-openai:latest
  _IMAGE: ${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}

options:
  dynamicSubstitutions: true
  machineType: E2_HIGHCPU_32
